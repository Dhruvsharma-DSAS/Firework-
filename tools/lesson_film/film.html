<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;600&family=Sora:wght@200;300;400&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#05070a}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="scripts.js"></script>
<script>
const W = 1280, H = 720;
const cv = document.getElementById("c");
const g = cv.getContext("2d");
const C = { bg: "#05070a", ink: "#e6edf3", dim: "#9aa6b5", faint: "#5b6676", line: "rgba(230,237,243,0.12)", modis: "#ffb547", viirs: "#3dd6f5", fire: "#ff4d5e", ok: "#39d98a", blue: "#1c49b8" };
const IMG = {};
let LESSON = null, TL = [], SCENES = [], TOTAL = 0;

function load(src) {
  return new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function ease(t) { const c = clamp(t, 0, 1); return c * c * (3 - 2 * c); }
function seg(u, a, b) { return ease((u - a) / (b - a)); }
function rnd(seed) { let s = seed; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
function font(size, w, fam) { g.font = (w || 400) + " " + size + "px " + (fam || "Inter, sans-serif"); }
function text(t, x, y, size, color, w, fam, align) { font(size, w, fam); g.fillStyle = color || C.ink; g.textAlign = align || "left"; g.textBaseline = "alphabetic"; g.fillText(t, x, y); }
function wrap(t, x, y, maxW, size, lh, color, w, fam, align) {
  font(size, w, fam); const words = t.split(" "); let line = ""; let yy = y; const lines = [];
  words.forEach((wd) => { const test = line ? line + " " + wd : wd; if (g.measureText(test).width > maxW && line) { lines.push(line); line = wd; } else { line = test; } });
  if (line) lines.push(line);
  lines.forEach((l) => { text(l, x, yy, size, color, w, fam, align); yy += lh; });
  return lines.length;
}
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function panel(x, y, w, h, stroke) { rr(x, y, w, h, 16); g.fillStyle = "rgba(10,14,22,0.85)"; g.fill(); g.strokeStyle = stroke || C.line; g.lineWidth = 1.2; g.stroke(); }
function chip(t, x, y, color) { font(12, 600, "JetBrains Mono, monospace"); const w = g.measureText(t).width + 26; rr(x, y, w, 26, 5); g.fillStyle = "rgba(5,7,10,0.75)"; g.fill(); g.strokeStyle = color; g.lineWidth = 1; g.stroke(); g.fillStyle = color; g.fillRect(x + 9, y + 10, 6, 6); text(t, x + 20, y + 17.5, 12, color, 600, "JetBrains Mono, monospace"); return w; }
function alpha(a, fn) { g.save(); g.globalAlpha = g.globalAlpha * clamp(a, 0, 1); fn(); g.restore(); }

const STARS = (() => { const r = rnd(5); const a = []; for (let i = 0; i < 160; i++) a.push([r() * W, r() * H, r() * 1.3, r()]); return a; })();
function background(t) {
  const gr = g.createRadialGradient(W * 0.7, H * 0.2, 50, W * 0.6, H * 0.5, W * 0.9);
  gr.addColorStop(0, "#0c1a33"); gr.addColorStop(1, "#03060d");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  STARS.forEach((s) => { g.fillStyle = "rgba(200,215,240," + (0.25 + 0.35 * Math.abs(Math.sin(t * 0.6 + s[3] * 9))) + ")"; g.fillRect(s[0], s[1], s[2] + 0.4, s[2] + 0.4); });
}
function chrome(sceneIdx, t, sc) {
  if (IMG.logo) g.drawImage(IMG.logo, 28, 18, 40, 40);
  text("FIREWORK", 78, 36, 15, C.ink, 400, "Sora, sans-serif");
  text("CHRONOS · " + (LESSON.badge || "LESSON " + LESSON.num), 78, 54, 10, C.faint, 400, "JetBrains Mono, monospace");
  text(LESSON.title.toUpperCase(), W - 28, 42, 11, C.dim, 400, "JetBrains Mono, monospace", "right");
  if (LESSON.noBar) return;
  g.fillStyle = "rgba(255,255,255,0.08)"; g.fillRect(28, H - 10, W - 56, 3);
  const grd = g.createLinearGradient(28, 0, W - 28, 0); grd.addColorStop(0, C.modis); grd.addColorStop(0.5, C.fire); grd.addColorStop(1, C.viirs);
  g.fillStyle = grd; g.fillRect(28, H - 10, (W - 56) * clamp(t / TOTAL, 0, 1), 3);
}
function subtitle(sc, u) {
  if (sc.type === "title" || sc.type === "chapter") return;
  const a = seg(u, 0, 0.06) * (1 - seg(u, 0.96, 1));
  alpha(a, () => {
    const grd = g.createLinearGradient(0, H - 150, 0, H); grd.addColorStop(0, "rgba(3,6,13,0)"); grd.addColorStop(0.35, "rgba(3,6,13,0.85)"); grd.addColorStop(1, "rgba(3,6,13,0.95)");
    g.fillStyle = grd; g.fillRect(0, H - 150, W, 150);
    wrap(sc.say, W / 2, H - 92, 1040, 20, 28, "#dfe6ee", 400, "Inter, sans-serif", "center");
  });
}
const AREA = { x: 80, y: 86, w: W - 160, h: 470 };

function drawImageScene(src, label, u) {
  const im = IMG[src]; if (!im) return;
  const z = 1 + 0.07 * u; const r = Math.min(AREA.w / im.width, AREA.h / im.height);
  const w = im.width * r, h = im.height * r; const x = W / 2 - w / 2, y = AREA.y + AREA.h / 2 - h / 2;
  alpha(seg(u, 0, 0.08), () => {
    g.save(); rr(x, y, w, h, 14); g.clip();
    g.drawImage(im, W / 2 - (w * z) / 2 - 12 * u, y + h / 2 - (h * z) / 2, w * z, h * z);
    g.restore(); rr(x, y, w, h, 14); g.strokeStyle = C.line; g.stroke();
    let col = C.viirs; if (label.indexOf("LIVE") >= 0) col = C.ok; if (label.indexOf("RUN_TESTED") >= 0 || label.indexOf("DIAGRAM") >= 0 || label.indexOf("OFFICIAL") >= 0) col = C.modis;
    chip(label, x + 14, y + 14, col);
  });
}
function drawCompare(sc, u) {
  const a = IMG[sc.a], b = IMG[sc.b]; if (!a || !b) return;
  const w = (AREA.w - 30) / 2; const h = Math.min(AREA.h, w * a.height / a.width); const y = AREA.y + (AREA.h - h) / 2;
  [[a, sc.la, AREA.x, C.modis, 0], [b, sc.lb, AREA.x + w + 30, C.viirs, 0.35]].forEach((p) => {
    alpha(seg(u, p[4], p[4] + 0.12), () => {
      g.save(); rr(p[2], y, w, h, 14); g.clip();
      const r = Math.max(w / p[0].width, h / p[0].height); const z = 1 + 0.05 * u;
      g.drawImage(p[0], p[2] + w / 2 - (p[0].width * r * z) / 2, y + h / 2 - (p[0].height * r * z) / 2, p[0].width * r * z, p[0].height * r * z);
      g.restore(); rr(p[2], y, w, h, 14); g.strokeStyle = p[3]; g.lineWidth = 1.5; g.stroke(); g.lineWidth = 1;
      chip(p[1], p[2] + 14, y + 14, p[3]);
    });
  });
}
function bigTitle(sc, u) {
  const a = seg(u, 0, 0.15) * (1 - seg(u, 0.9, 1));
  alpha(a, () => {
    text(LESSON.badge || "LESSON " + LESSON.num, W / 2, 250, 16, C.modis, 600, "JetBrains Mono, monospace", "center");
    wrap(LESSON.title, W / 2, 330, 1000, 62, 72, C.ink, 300, "Sora, sans-serif", "center");
    text(LESSON.kicker, W / 2, 470, 20, C.dim, 300, "Inter, sans-serif", "center");
    const ww = 260 * seg(u, 0.1, 0.5); const grd = g.createLinearGradient(W / 2 - 130, 0, W / 2 + 130, 0); grd.addColorStop(0, C.modis); grd.addColorStop(1, C.viirs);
    g.fillStyle = grd; g.fillRect(W / 2 - ww / 2, 500, ww, 3);
  });
  drawSat(W / 2 + 330 - 660 * u, 150 + 20 * Math.sin(u * 6), 0.9, -0.2);
}
function drawSat(x, y, s, rot) {
  g.save(); g.translate(x, y); g.rotate(rot || 0); g.scale(s, s);
  g.fillStyle = C.blue; g.strokeStyle = "#cfe3ff"; g.lineWidth = 1.5;
  [-1, 1].forEach((d) => { const px = d < 0 ? -78 : 22; g.fillRect(px, -14, 56, 28); g.strokeRect(px, -14, 56, 28); g.beginPath(); for (let k = 1; k < 4; k++) { g.moveTo(px + k * 14, -14); g.lineTo(px + k * 14, 14); } g.moveTo(px, 0); g.lineTo(px + 56, 0); g.strokeStyle = "rgba(207,227,255,0.7)"; g.stroke(); g.strokeStyle = "#cfe3ff"; });
  g.fillStyle = "#9aa6b5"; g.fillRect(-22, -3, 44, 6);
  const bg = g.createLinearGradient(-16, 0, 16, 0); bg.addColorStop(0, "#8b97a8"); bg.addColorStop(0.5, "#f1f4f8"); bg.addColorStop(1, "#8b97a8");
  g.fillStyle = bg; rr(-16, -24, 32, 40, 6); g.fill(); g.fillStyle = C.modis; g.fillRect(-16, -16, 32, 5);
  g.fillStyle = "#ffe7a0"; g.beginPath(); g.arc(0, 22, 5, 0, 7); g.fill();
  g.restore();
}
function flame(x, y, s, t) {
  g.save(); g.translate(x, y); g.scale(s, s * (1 + 0.06 * Math.sin(t * 9)));
  const gr = g.createLinearGradient(0, 20, 0, -30); gr.addColorStop(0, C.fire); gr.addColorStop(0.6, C.modis); gr.addColorStop(1, "#fff1c2");
  g.fillStyle = gr; g.beginPath(); g.moveTo(0, -30); g.bezierCurveTo(14, -12, 20, 0, 16, 10); g.bezierCurveTo(12, 22, -12, 22, -16, 10); g.bezierCurveTo(-20, -2, -8, -8, -6, -18); g.bezierCurveTo(-2, -10, 2, -10, 0, -30); g.fill();
  g.restore();
}

const DRAW = {
  bands(sc, u, t) {
    const T = 300 + 700 * seg(u, 0.15, 0.7);
    const p4 = (T - 300) / 700, b4 = 30 + 330 * Math.pow(p4, 1.4), b11 = 30 + 60 * p4;
    panel(140, 110, 1000, 430);
    text("Temperature in the pixel", 180, 160, 16, C.dim);
    text(Math.round(T) + " K", 180, 210, 44, T > 800 ? C.fire : C.modis, 300, "Sora, sans-serif");
    [["4 µm · mid-infrared", 560, b4, C.fire, "× 4,927 from 300 K to 1000 K"], ["11 µm · thermal", 860, b11, C.viirs, "× 28.6"]].forEach((b) => {
      g.fillStyle = "rgba(255,255,255,0.06)"; g.fillRect(b[1], 140, 120, 360);
      g.fillStyle = b[3]; g.fillRect(b[1], 500 - b[2], 120, b[2]);
      text(b[0], b[1] + 60, 530, 15, C.ink, 400, "Inter", "center");
      alpha(seg(u, 0.7, 0.8), () => text(b[4], b[1] + 60, 485 - b[2], 15, C.ink, 600, "JetBrains Mono, monospace", "center"));
    });
    flame(300, 380, 2.2 * (0.4 + p4), t);
    chip("PHYSICS · PLANCK'S LAW", 180, 470, C.modis);
  },
  subpixel(sc, u, t) {
    const x = 390, y = 110, s = 420;
    const glow = seg(u, 0.25, 0.6);
    g.fillStyle = "rgb(" + Math.round(40 + 200 * glow) + "," + Math.round(50 + 60 * glow) + "," + Math.round(60 - 20 * glow) + ")"; g.fillRect(x, y, s, s);
    g.strokeStyle = C.ink; g.lineWidth = 2; g.strokeRect(x, y, s, s); g.lineWidth = 1;
    g.fillStyle = "rgba(60,120,60,0.35)"; for (let i = 0; i < 6; i++) g.fillRect(x + 20 + i * 66, y + 20, 50, s - 40);
    flame(x + 300, y + 260, 0.8, t);
    text("1 km MODIS pixel", x + s / 2, y + s + 30, 16, C.ink, 400, "Inter", "center");
    alpha(seg(u, 0.4, 0.55), () => { text("small fire, tiny share of the area", 900, 300, 16, C.dim); text("→ whole pixel's 4 µm signal rises", 900, 330, 16, C.fire, 600); });
    chip("DIAGRAM", x, y - 40, C.modis);
  },
  context(sc, u, t) {
    const n = 7, cs = 56, x0 = 440, y0 = 120;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const isFire = i === 3 && j === 3; const v = 0.35 + 0.15 * Math.sin(i * 2 + j);
      g.fillStyle = isFire ? "rgb(" + Math.round(120 + 135 * seg(u, 0.2, 0.4)) + ",70,60)" : "rgba(80,100,130," + v + ")";
      g.fillRect(x0 + i * cs, y0 + j * cs, cs - 3, cs - 3);
    }
    const sw = seg(u, 0.3, 0.7);
    g.strokeStyle = C.viirs; g.lineWidth = 2; g.strokeRect(x0 + 1 * cs - 2, y0 + 1 * cs - 2, 5 * cs + 1, 5 * cs + 1); g.lineWidth = 1;
    alpha(sw, () => { g.strokeStyle = C.fire; g.lineWidth = 3; g.strokeRect(x0 + 3 * cs - 3, y0 + 3 * cs - 3, cs + 3, cs + 3); g.lineWidth = 1; });
    const tags = [["Cloud & water masked", C.dim], ["Hotter than its neighbours?", C.viirs], ["Deserts, roofs, glint filtered", C.dim], ["→ active fire pixel", C.fire]];
    tags.forEach((tg, i) => alpha(seg(u, 0.15 + i * 0.15, 0.25 + i * 0.15), () => text(tg[0], 860, 200 + i * 52, 20, tg[1], 400)));
    chip("DIAGRAM", x0, y0 - 40, C.modis);
  },
  pixels(sc, u, t) {
    const x1 = 170, x2 = 700, y = 120, s = 410;
    const r = rnd(9); const fires = []; for (let i = 0; i < 9; i++) fires.push([r() * s, r() * s]);
    [[x1, 1, C.modis, "MODIS · 1 km pixels"], [x2, 3, C.viirs, "VIIRS · 375 m pixels"]].forEach((p, k) => {
      alpha(seg(u, k * 0.3, k * 0.3 + 0.15), () => {
        g.fillStyle = "#0e2140"; g.fillRect(p[0], y, s, s);
        const n = p[1] === 1 ? 2 : 6; const cs = s / n;
        for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
          const hit = fires.some((f) => f[0] >= i * cs && f[0] < (i + 1) * cs && f[1] >= j * cs && f[1] < (j + 1) * cs);
          const big = fires.filter((f) => f[0] >= i * cs && f[0] < (i + 1) * cs && f[1] >= j * cs && f[1] < (j + 1) * cs).length;
          if (hit && (p[1] === 3 || big >= 3)) { g.fillStyle = "rgba(255,77,94," + (0.45 + 0.4 * seg(u, 0.5, 0.7)) + ")"; g.fillRect(p[0] + i * cs, y + j * cs, cs, cs); }
          g.strokeStyle = p[2]; g.strokeRect(p[0] + i * cs, y + j * cs, cs, cs);
        }
        fires.forEach((f) => flame(p[0] + f[0], y + f[1], 0.32, t + f[0]));
        text(p[3], p[0] + s / 2, y + s + 32, 18, p[2], 600, "Inter", "center");
      });
    });
    alpha(seg(u, 0.65, 0.8), () => text("≈ 7 VIIRS pixels fit in 1 MODIS pixel  (1 km² ÷ 0.375² km²)", W / 2, 100, 17, C.ink, 400, "JetBrains Mono, monospace", "center"));
  },
  swath(sc, u, t) {
    const sx = W / 2, sy = 130; drawSat(sx, sy, 0.7, 0);
    const sweep = Math.sin(t * 2.2);
    g.fillStyle = "rgba(61,214,245,0.12)"; g.beginPath(); g.moveTo(sx, sy + 20); g.lineTo(sx - 520, 470); g.lineTo(sx + 520, 470); g.fill();
    g.strokeStyle = C.viirs; g.beginPath(); g.moveTo(sx, sy + 20); g.lineTo(sx + 520 * sweep, 470); g.stroke();
    let x = 0; const show = seg(u, 0.1, 0.6);
    while (x < 520) { const w = 22 + Math.pow(x / 520, 2) * 70; [-1, 1].forEach((d) => { const px = d > 0 ? sx + x : sx - x - w; alpha(show, () => { g.strokeStyle = C.modis; g.strokeRect(px, 480, w - 3, 40 + (w - 22) * 0.4); }); }); x += w; }
    alpha(seg(u, 0.5, 0.65), () => { text("small at nadir", sx, 600 - 40, 16, C.ink, 400, "Inter", "center"); text("several times larger at the edge", 150, 600 - 40, 16, C.modis, 400); });
    chip("DIAGRAM", 80, 100, C.modis);
  },
  cloud(sc, u, t) {
    const x0 = 240, y0 = 160, n = 10, cs = 52; const r = rnd(4);
    const cx = 200 + 600 * seg(u, 0.1, 0.8);
    for (let i = 0; i < n; i++) for (let j = 0; j < 6; j++) {
      const px = x0 + i * cs * 1.6, py = y0 + j * cs; const fire = r() < 0.2;
      const covered = Math.abs(px - (cx + 240)) < 260 && j < 6;
      g.fillStyle = covered ? "rgba(140,150,165,0.35)" : (fire ? "rgba(255,77,94,0.85)" : "rgba(60,120,80,0.45)");
      g.fillRect(px, py, cs * 1.6 - 4, cs - 4);
      if (covered) text("?", px + cs * 0.8, py + cs * 0.65, 18, C.ink, 600, "Inter", "center");
    }
    alpha(0.92, () => { for (let k = 0; k < 7; k++) { g.fillStyle = "rgba(235,240,248,0.85)"; g.beginPath(); g.ellipse(cx + 240 + Math.cos(k) * 160, 200 + Math.sin(k * 2) * 40, 120, 55, 0, 0, 7); g.fill(); } });
    alpha(seg(u, 0.35, 0.5), () => { chip("CLOUD = NOT OBSERVED", 240, 520, C.dim); chip("NEVER = 0 FIRE", 470, 520, C.fire); });
  },
  clock(sc, u, t) {
    const cx = 420, cy = 320, R = 190;
    g.strokeStyle = C.line; g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.stroke(); g.lineWidth = 1;
    for (let h = 0; h < 24; h++) { const a = -Math.PI / 2 + h * Math.PI / 12; g.strokeStyle = h % 6 ? "rgba(230,237,243,0.25)" : C.ink; g.beginPath(); g.moveTo(cx + (R - 10) * Math.cos(a), cy + (R - 10) * Math.sin(a)); g.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a)); g.stroke(); }
    ["00", "06", "12", "18"].forEach((l, i) => { const a = -Math.PI / 2 + i * Math.PI / 2; text(l, cx + (R + 26) * Math.cos(a), cy + (R + 26) * Math.sin(a) + 5, 14, C.dim, 400, "JetBrains Mono", "center"); });
    const passes = [[1.5, C.viirs, "01:30"], [10.5, C.modis, "10:30"], [13.5, C.viirs, "13:30"], [22.5, C.modis, "22:30"]];
    passes.forEach((p, i) => alpha(seg(u, 0.1 + i * 0.12, 0.2 + i * 0.12), () => { const a = -Math.PI / 2 + p[0] * Math.PI / 12; g.fillStyle = p[1]; g.beginPath(); g.arc(cx + (R - 34) * Math.cos(a), cy + (R - 34) * Math.sin(a), 9, 0, 7); g.fill(); text(p[2], cx + (R - 70) * Math.cos(a), cy + (R - 70) * Math.sin(a) + 5, 14, p[1], 600, "JetBrains Mono", "center"); }));
    const hand = 24 * ((t * 0.12) % 1); const ha = -Math.PI / 2 + hand * Math.PI / 12;
    g.strokeStyle = C.ink; g.lineWidth = 2; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + (R - 50) * Math.cos(ha), cy + (R - 50) * Math.sin(ha)); g.stroke(); g.lineWidth = 1;
    panel(720, 170, 440, 290);
    text("A fire between passes", 750, 215, 20, C.ink, 400);
    const bx = 750, by = 390, bw = 380; g.strokeStyle = C.line; g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + bw, by); g.stroke();
    [10.5, 13.5].forEach((p, i) => { const x = bx + (p / 24) * bw * 2 - bw * 0.8; g.strokeStyle = i ? C.viirs : C.modis; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(x, 250); g.lineTo(x, by); g.stroke(); g.setLineDash([]); });
    const fx = bx + 0.6 * bw; alpha(seg(u, 0.5, 0.6), () => { flame(fx, by - 40, 0.9, t); text("lit and out unseen", fx, by + 30, 14, C.fire, 600, "Inter", "center"); });
  },
  rate(sc, u, t) {
    const rows = [["Month A", 6, 30, C.modis], ["Month B", 6, 10, C.viirs]];
    panel(180, 120, 920, 400);
    text("fire-days ÷ clear-sky days", W / 2, 170, 22, C.ink, 300, "Sora", "center");
    rows.forEach((r, i) => {
      const y = 230 + i * 130; text(r[0], 220, y + 22, 18, r[3], 600);
      for (let d = 0; d < 30; d++) { const clear = d < r[2]; g.fillStyle = clear ? "rgba(80,140,100,0.6)" : "rgba(140,150,165,0.35)"; g.fillRect(340 + d * 18, y, 14, 30); }
      for (let d = 0; d < r[1]; d++) { alpha(seg(u, 0.2 + d * 0.03, 0.3 + d * 0.03), () => { g.fillStyle = C.fire; g.fillRect(340 + d * 18 * (r[2] / 6), y, 14, 30); }); }
      alpha(seg(u, 0.55, 0.7), () => text(r[1] + " ÷ " + r[2] + " = " + (r[1] / r[2]).toFixed(2), 900, y + 22, 22, C.ink, 600, "JetBrains Mono"));
    });
    alpha(seg(u, 0.75, 0.85), () => text("Same count, very different rate", W / 2, 490, 18, C.dim, 400, "Inter", "center"));
    chip("ILLUSTRATIVE NUMBERS", 200, 132, C.modis);
  },
  jump(sc, u, t) {
    const x0 = 220, y0 = 480, w = 840, h = 330; panel(170, 110, 940, 440);
    g.strokeStyle = C.line; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + w, y0); g.stroke();
    const yr = (v) => y0 - (v / 26000) * h;

const FR = { x: 100, y: 80, w: 1080, bar: 28, h: 482 };

}

  g.save(); rr(FR.x, FR.y, FR.w, FR.h, 14); g.clip();
  g.fillStyle = "#121826"; g.fillRect(FR.x, FR.y, FR.w, FR.bar);

let HIRES = 1;
function renderAt(t) {
  g.setTransform(HIRES, 0, 0, HIRES, 0, 0);
  background(t);
  let i = 0; while (i < TL.length - 1 && t >= TL[i + 1].start) i++;

  if (SCENES[i + 1] && SCENES[i + 1].start) fadeOut = 1;
  const fade = fadeIn * fadeOut;
  alpha(i === 0 ? 1 : fade, () => {
    if (sc.type === "title") bigTitle(sc, u);
    else if (sc.type === "end") endCard(sc, u, t);
    else if (sc.type === "image") drawImageScene(sc.src, sc.label, u);
    else if (sc.type === "compare") drawCompare(sc, u);
    else if (sc.type === "screen") drawScreen(sc, u, t);
    else if (sc.type === "points") drawPoints(sc, u, t);
    else if (sc.type === "says") drawSays(sc, u, t);
    else if (sc.type === "agenda") drawAgenda(sc, u, t);
    else if (sc.type === "chapter") drawChapter(sc, u, t);

  chrome(i, t, sc);

  for (const s of srcs) IMG[s] = await load(s);

};

};
