<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="/katex/katex.min.css" />
<script src="/katex/katex.min.js"></script>
<style>
@font-face { font-family: "Serif4"; src: url("/serif/source-serif-4-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Serif4"; src: url("/serif/source-serif-4-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
@font-face { font-family: "Serif4"; src: url("/serif/source-serif-4-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
:root { --bg: #070a0f; --text: #e9eef4; --dim: #9aa6b5; --faint: #5b6676; --line: rgba(230,237,243,0.12); --ember: #ff7a4d; --ember2: #ffb547; --viirs: #3dd6f5; --good: #39d98a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
#stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background:
  radial-gradient(900px 520px at 78% 18%, rgba(255,122,77,0.10), transparent 60%),
  radial-gradient(700px 500px at 10% 100%, rgba(61,214,245,0.06), transparent 60%), var(--bg); }
#grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 40px 40px; }
#top { position: absolute; left: 64px; right: 64px; top: 30px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; letter-spacing: 0.06em; color: var(--faint); }
#top b { color: var(--dim); font-weight: 600; letter-spacing: 0.2em; }
#top .fid { color: var(--ember2); font-family: Menlo, monospace; letter-spacing: 0.04em; }
#bar { position: absolute; left: 64px; right: 64px; bottom: 22px; height: 2px; background: rgba(255,255,255,0.08); }
#bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ember); }
#steps { position: absolute; left: 64px; bottom: 32px; display: flex; gap: 14px; font-size: 11.5px; color: var(--faint); letter-spacing: 0.04em; }
#steps span.on { color: var(--ember2); }
#sub { position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); max-width: 1000px; padding: 8px 16px; border-radius: 8px; background: rgba(4,6,10,0.72); font-size: 20px; line-height: 1.4; text-align: center; color: #f1f4f8; }
.scene { position: absolute; left: 64px; right: 64px; top: 84px; bottom: 120px; opacity: 0; }
.k { font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ember2); font-weight: 600; }
.h { font-family: "Serif4", Georgia, serif; font-weight: 400; color: var(--text); }
.p { font-family: "Serif4", Georgia, serif; font-size: 25px; line-height: 1.5; color: var(--dim); }
.rise { will-change: transform, opacity; }
.t-num { font-family: "Serif4", Georgia, serif; font-size: 150px; line-height: 1; color: var(--ember); }
.t-name { font-size: 58px; line-height: 1.1; margin: 18px 0 18px; max-width: 1050px; }
.t-chips { display: flex; gap: 10px; margin-top: 26px; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 999px; font-size: 15px; color: var(--dim); box-shadow: inset 0 0 0 1px var(--line); }
.chip i { width: 8px; height: 8px; border-radius: 2px; background: var(--good); }
.eqbox { margin-top: 40px; padding: 30px 0 26px; border-top: 2px solid var(--text); border-bottom: 1px solid rgba(230,237,243,0.3); }
.eqrow { display: grid; grid-template-columns: 1fr 110px; align-items: center; }
.eqrow .katex-display { margin: 0.35em 0; }
.eqrow .katex { font-size: 2.05em; }
.eqno { text-align: right; font-family: Menlo, monospace; font-size: 18px; color: var(--faint); }
.reads { margin-top: 26px; font-style: italic; font-size: 24px; }
.sym { margin-top: 30px; display: grid; gap: 0; }
.sym-row { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
.sym-row .katex { font-size: 1.7em; color: var(--text); }
.sym-row .m { font-size: 21px; line-height: 1.45; color: var(--dim); }
.sec { display: grid; grid-template-columns: 120px 1fr; gap: 28px; margin-top: 18px; }
.sec .n { font-family: "Serif4", Georgia, serif; font-size: 84px; line-height: 1; color: var(--ember); }
.sec h2 { font-size: 44px; margin-bottom: 18px; }
.steps { list-style: none; display: grid; gap: 20px; margin-top: 10px; }
.steps li { display: grid; grid-template-columns: 54px 1fr; gap: 14px; font-family: "Serif4", Georgia, serif; font-size: 24px; line-height: 1.45; color: var(--dim); }
.steps li b { font-family: Menlo, monospace; font-size: 18px; color: var(--ember2); padding-top: 5px; font-weight: 600; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 26px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.keys div { padding: 20px 18px 18px 0; }
.keys div + div { padding-left: 18px; border-left: 1px solid var(--line); }
.keys b { display: block; font-family: "Serif4", Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1.1; color: var(--ember); }
.keys span { display: block; margin-top: 8px; font-size: 16px; line-height: 1.35; color: var(--dim); }
.ex { margin-top: 24px; font-size: 22px; }
.fig { position: absolute; left: 0; right: 0; top: 40px; bottom: 0; display: grid; grid-template-columns: 1.55fr 1fr; gap: 34px; align-items: center; }
.paper { background: #fff; border-radius: 10px; padding: 18px; height: 100%; display: grid; place-items: center; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,0.45); }
.paper img { max-width: 100%; max-height: 100%; object-fit: contain; }
.fig h3 { font-size: 34px; margin: 12px 0 14px; }
.fig .p { font-size: 20px; }
.pages { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
.pg { height: 52px; padding: 0 20px; display: inline-flex; align-items: center; gap: 12px; border-radius: 10px; font-size: 20px; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--ember); background: rgba(255,122,77,0.10); }
.pg small { font-family: Menlo, monospace; font-size: 14px; color: var(--dim); }
.pdf { margin-top: 36px; display: flex; align-items: center; gap: 16px; font-size: 21px; color: var(--dim); }
.pdf i { font-style: normal; font-family: Menlo, monospace; font-size: 14px; font-weight: 700; color: #ff6b6b; padding: 8px 10px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px rgba(255,107,107,0.6); }
.next { margin-top: 30px; font-size: 18px; color: var(--faint); }
.next b { color: var(--ember2); font-weight: 600; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="top"><b>FIREWORK CHRONOS · METHOD REFERENCE</b><span class="fid" id="fid"></span></div>
  <div id="scenes"></div>
  <div id="sub"></div>
  <div id="steps"></div>
  <div id="bar"><i id="barfill"></i></div>
</div>
<script>
const LABELS = { title: "Formula", equation: "Equation", symbols: "Symbols", why: "Why", how: "How", example: "Example", figure: "Figure", end: "On the site" };
const PAGE = { explore: ["Explorer", "/explore"], calendar: ["Calendar", "/calendar"], sensors: ["Sensor Lab", "/sensors"], validation: ["Validation", "/validation"], sources: ["Sources", "/sources"], blind: ["Blind Spot", "/blind-spot"], brief: ["Brief", "/brief"] };
const ST = { f: null, scenes: [], timeline: [], els: [], subs: [] };

function esc(t) { return String(t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function tex(t, display) { return katex.renderToString(t, { displayMode: display, throwOnError: false, strict: "ignore" }); }
function rich(t) { return String(t || "").split("$").map((p, i) => i % 2 ? tex(p, false) : esc(p)).join(""); }
function words(t, n) { const w = String(t || "").split(/\s+/); return w.length > n ? w.slice(0, n).join(" ") + " …" : t; }
function firstStr(a) { return (a || []).filter((x) => typeof x === "string"); }
function steps(f) {
  const out = [];
  firstStr(f.how).forEach((t) => { if (t.indexOf("•") >= 0) { t.split("•").map((x) => x.trim()).filter((x) => x).forEach((x) => out.push(x)); } });
  if (out.length === 0) { firstStr(f.how).slice(0, 3).forEach((x) => out.push(x)); }
  return out.slice(0, 3);
}

function build(type, f, next) {
  if (type === "title") {
    return '<div class="k rise" data-d="0">' + esc(f.family) + '</div><div class="t-num rise" data-d="0.1">' + f.id + '</div><h1 class="h t-name rise" data-d="0.25">' + esc(f.name) + '</h1><div class="p rise" data-d="0.45" style="max-width:1020px">' + rich(words(f.lead, 46)) + '</div><div class="t-chips rise" data-d="0.65"><span class="chip"><i style="background:' + ({ live: "#39d98a", library: "#3dd6f5", awaiting: "#ffb547", experimental: "#a99cff" }[f.status] || "#9aa6b5") + '"></i>' + esc(f.status_label) + '</span><span class="chip">' + esc(f.layer) + '</span></div>';
  }
  if (type === "equation") {
    const eqs = f.equations.slice(0, 3);
    return '<div class="k rise" data-d="0">The formula</div><div class="eqbox rise" data-d="0.15">' + eqs.map((e, i) => '<div class="eqrow">' + tex(e, true) + '<span class="eqno">(' + f.id + (eqs.length > 1 ? "." + (i + 1) : "") + ')</span></div>').join("") + '</div><div class="p reads rise" data-d="0.5">' + rich(words(f.reads, 55)) + '</div>';
  }
  if (type === "symbols") {
    return '<div class="k rise" data-d="0">What each symbol means</div><div class="sym">' + f.symbols.slice(0, 5).map((s, i) => '<div class="sym-row rise" data-d="' + (0.15 + i * 0.12) + '"><div>' + tex(s.tex, false) + '</div><div class="m">' + rich(words(s.meaning, 22)) + (s.unit ? ' <span style="color:#5b6676">· ' + esc(s.unit) + '</span>' : "") + '</div></div>').join("") + '</div>';
  }
  if (type === "why") {
    return '<div class="sec"><div class="n rise" data-d="0">02</div><div><h2 class="h rise" data-d="0.1">Why FIREWORK needs it</h2><div class="p rise" data-d="0.3">' + rich(words(firstStr(f.why).join(" "), 75)) + '</div></div></div>';
  }
  if (type === "how") {
    const st = steps(f);
    return '<div class="sec"><div class="n rise" data-d="0">03</div><div><h2 class="h rise" data-d="0.1">How it works</h2><ol class="steps">' + st.map((s, i) => '<li class="rise" data-d="' + (0.25 + i * 0.22) + '"><b>0' + (i + 1) + '</b><span>' + rich(words(s, 34)) + '</span></li>').join("") + '</ol></div></div>';
  }
  if (type === "example") {
    const keys = (f.key_numbers || []).slice(0, 4);
    return '<div class="k rise" data-d="0">Worked example</div><div class="keys">' + keys.map((k, i) => '<div class="rise" data-d="' + (0.12 + i * 0.12) + '"><b>' + esc(k.value) + '</b><span>' + esc(k.label) + '</span></div>').join("") + '</div><div class="p ex rise" data-d="0.6">' + rich(words(firstStr(f.example)[0], 60)) + '</div>';
  }
  if (type === "figure") {
    const g = f.figures[0];
    return '<div class="k rise" data-d="0">Figure</div><div class="fig"><div class="paper rise" data-d="0.1"><img src="/formulas/' + g.file + '" /></div><div><h3 class="h rise" data-d="0.3">' + esc(g.title) + '</h3><div class="p rise" data-d="0.45">' + rich(words(g.caption, 48)) + '</div><div class="rise" data-d="0.6" style="margin-top:14px;font-size:15px;color:#5b6676">Data: ' + esc(words(g.data, 20)) + '</div></div></div>';
  }
  const pages = (f.pages || []).filter((p) => PAGE[p]);
  return '<div class="k rise" data-d="0">Where it lives in FIREWORK</div><div class="pages">' + pages.map((p, i) => '<span class="pg rise" data-d="' + (0.15 + i * 0.1) + '">' + PAGE[p][0] + ' <small>' + PAGE[p][1] + '</small></span>').join("") + '</div><div class="pdf rise" data-d="0.5"><i>PDF</i>Full derivation, figures and references: ' + esc(f.pdf) + '</div>' + (next ? '<div class="next rise" data-d="0.7">Next · <b>' + next.id + '</b> ' + esc(next.name) + '</div>' : "");
}

function chunks(text) {
  const w = String(text).split(/\s+/);
  const out = [];
  for (let i = 0; i < w.length; i += 13) out.push(w.slice(i, i + 13).join(" "));
  return out;
}

window.setup = async function (f, next, scenes, timeline) {
  ST.f = f; ST.scenes = scenes; ST.timeline = timeline;
  document.getElementById("fid").textContent = f.id + " · " + f.family;
  const host = document.getElementById("scenes");
  host.innerHTML = "";
  ST.els = scenes.map((s) => { const d = document.createElement("div"); d.className = "scene"; d.innerHTML = build(s.type, f, next); host.appendChild(d); return d; });
  ST.subs = scenes.map((s) => ({ parts: chunks(s.text), words: s.text.split(/\s+/).length }));
  document.getElementById("steps").innerHTML = scenes.map((s) => '<span>' + LABELS[s.type] + '</span>').join("");
  await document.fonts.ready;
  await Promise.all(Array.from(document.images).map((im) => im.complete ? 1 : new Promise((r) => { im.onload = r; im.onerror = r; })));
  return true;
};

function ease(x) { x = Math.max(0, Math.min(1, x)); return 1 - Math.pow(1 - x, 3); }

window.renderAt = function (t) {
  const tl = ST.timeline;
  const total = tl[tl.length - 1].start + tl[tl.length - 1].dur;
  let cur = 0;
  tl.forEach((s, i) => { if (t >= s.start) cur = i; });
  ST.els.forEach((el, i) => {
    const s = tl[i];
    const local = t - s.start;
    let o = 0;
    if (local >= 0 && local <= s.dur) {
      o = Math.min(1, local / 0.45) * Math.min(1, (s.dur - local) / 0.4);
    }
    el.style.opacity = String(Math.max(0, o));
    el.style.display = o > 0 ? "block" : "none";
    if (o > 0) {
      el.querySelectorAll(".rise").forEach((r) => {
        const d = Number(r.getAttribute("data-d") || 0);
        const k = ease((local - d) / 0.7);
        r.style.opacity = String(k);
        r.style.transform = "translateY(" + ((1 - k) * 22).toFixed(1) + "px)";
      });
    }
  });
  const sub = ST.subs[cur];
  const s = tl[cur];
  const voice = Math.max(0.1, s.voice || s.dur);
  const p = Math.max(0, Math.min(0.999, (t - s.start - (s.lead || 0)) / voice));
  const idx = Math.min(sub.parts.length - 1, Math.floor(p * sub.parts.length));
  document.getElementById("sub").textContent = sub.parts[idx] || "";
  document.getElementById("sub").style.opacity = t - s.start < (s.lead || 0) ? "0" : "1";
  document.getElementById("barfill").style.width = (100 * Math.min(1, t / total)).toFixed(2) + "%";
  Array.from(document.getElementById("steps").children).forEach((c, i) => { c.className = i === cur ? "on" : ""; });
};
</script>
</body>
</html>
